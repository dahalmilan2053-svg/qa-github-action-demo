name: Insurance Tool QA Automation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: insurance-tool-qa-automation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-automation-tests:
    name: Run QA automation suite
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Maven
        run: mvn --version

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Create runtime credentials.properties from GitHub Secrets
        shell: bash
        env:
          SERVICE_ACCOUNT_USERNAME: ${{ secrets.SERVICE_ACCOUNT_USERNAME }}
          SERVICE_ACCOUNT_PASSWORD: ${{ secrets.SERVICE_ACCOUNT_PASSWORD }}
        run: |
          if [ -z "$SERVICE_ACCOUNT_USERNAME" ] || [ -z "$SERVICE_ACCOUNT_PASSWORD" ]; then
            echo "Required secrets are missing"
            exit 1
          fi

          printf 'Username=%s\nPassword=%s\n' "$SERVICE_ACCOUNT_USERNAME" "$SERVICE_ACCOUNT_PASSWORD" > credentials.properties
          echo "credentials.properties created successfully."

      - name: Run QA automation tests
        id: run-tests
        continue-on-error: true
        env:
          LOGIN_USERNAME: ${{ secrets.SERVICE_ACCOUNT_USERNAME }}
          LOGIN_PASSWORD: ${{ secrets.SERVICE_ACCOUNT_PASSWORD }}
        run: mvn -B -ntp clean test

      - name: Generate Surefire HTML report
        if: always()
        run: mvn -B -ntp surefire-report:report-only

      - name: Publish test results as GitHub Check
        if: always()
        uses: dorny/test-reporter@v4
        with:
          name: Insurance Tool QA Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false

      - name: Write collective test summery to job summary
        if: always()
        shell: bash
        run: |
          echo "## Insurance Tool QA Test Results" $GITHUB_STEP_SUMMERY
          echo "" >> $GITHUB_STEP_SUMMERY
          
          TOTAL=0; PASSED=0; FAILED=0; ERRORS=0; SKIPPED=0
          
          for f in target/surfire-reports/*.xml; do
          [ -e "$f" ] || continue

            t=$(grep -oP '(?<=tests=")[^"]+' "$f" | head -1)
            fa=$(grep -oP '(?<=failures=")[^"]+' "$f" | head -1)
            e=$(grep -oP '(?<=errors=")[^"]+' "$f" | head -1)
            s=$(grep -oP '(?<=skipped=")[^"]+' "$f" | head -1)

            TOTAL=$((TOTAL + ${t:-0}))
            FAILED=$((FAILED + ${fa:-0}))
            ERROR=$((ERRORS + ${e:-0}))
            SKIPPED=$((SKIPPED + ${s:-0}))
          done

          PASSED=$((TOTAL - FAILED - ERROR - SKIPPED))

          echo "| Result  | Count   |" >> $GITHUB_STEP_SUMMARY
          echo "|-------- |-------  |" >> $GITHUB_STEP_SUMMARY
          echo "| Total   | $TOTAL  |" >> $GITHUB_STEP_SUMMARY
          echo "| Passed  | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Failed  | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| Errors  | $ERROR  |" >> $GITHUB_STEP_SUMMARY
          echo "| Skipped | $SKIPPED|" >> $GITHUB_STEP_SUMMARY
          
          if [ $((FAILED + ERRORS)) -gt 0 ] then
            echo "## $((FAILED + ERRORS)) test(s) need attention - download the artifact below for for full HTML report." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "### ALL $TOTAL test(s) passed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload QA test reports artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-automation-test-reports
          if-no-files-found: warn
          path: |
            target/surfire-reports/**
            target/site/**
            test-output/**
            **/cucumber*.json
            **/cucumber*.htlm
            **/extent*.html
